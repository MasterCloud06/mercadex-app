name: build

on:
  push:
    branches: [ main, develop, 'feature/**', 'fix/**' ]
  pull_request:

jobs:
  movil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Revisar tipos
        run: npx tsc --noEmit
      - name: Empaquetar la app (Android)
        run: npx expo export --platform android --output-dir dist
        env:
          CI: 1
